<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mason Hub Academy — Formação & Compêndio Histórico</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0d10;
            color: #d1d5db;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: linear-gradient(145deg, #13171f 0%, #0b0d10 100%);
            border: 1px solid #c5a059;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(197, 160, 89, 0.05);
        }

        .brand-title {
            font-size: 11pt;
            letter-spacing: 3px;
            color: #c5a059;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .emblem-svg {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px auto;
        }

        .main-title {
            font-size: 24pt;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 12pt;
            color: #9ca3af;
            margin-bottom: 25px;
            line-height: 1.6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .divider {
            width: 80px;
            height: 2px;
            background-color: #c5a059;
            margin: 0 auto 30px auto;
        }

        .author-box {
            font-size: 11pt;
            color: #e5e7eb;
            font-weight: 700;
            margin-bottom: 35px;
        }

        .author-box span {
            display: block;
            font-size: 9.5pt;
            color: #c5a059;
            font-weight: 400;
            margin-top: 4px;
        }

        /* Botão Kiwify */
        .btn-kiwify {
            display: inline-block;
            background-color: #c5a059;
            color: #0b0d10;
            font-size: 12pt;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 18px 36px;
            border-radius: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
        }

        .btn-kiwify:hover {
            background-color: #dfb76c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(197, 160, 89, 0.5);
        }

        .footer-note {
            font-size: 8.5pt;
            color: #6b7280;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-title">Mason Hub Academy</div>

        <!-- Esquadro e Compasso Vetorial -->
        <svg class="emblem-svg" viewBox="0 0 100 100">
            <path d="M50 10 L15 85 L25 85 L50 30 L75 85 L85 85 Z" fill="#c5a059" />
            <path d="M20 50 L80 50 L80 57 L20 57 Z" fill="#c5a059" />
            <circle cx="50" cy="53.5" r="5" fill="#c5a059" />
        </svg>

        <h1 class="main-title">Apostila Executiva I</h1>
        <p class="subtitle">História, Mitos, Ritos & Conflitos Históricos da Maçonaria Universal</p>

        <div class="divider"></div>

        <div class="author-box">
            Yuri Abyaza Costa
            <span>M∴ M∴ | CIM: 1328/17</span>
        </div>

        <!-- Link Direto para o Checkout da Kiwify -->
        <a href="https://pay.kiwify.com.br/dsXLdtB" class="btn-kiwify" target="_blank">
            Garantir Minha Apostila Agora
        </a>

        <div class="footer-note">
            Acesso imediato via Área de Membros Kiwify pós-confirmação.
        </div>
    </div>

</body>
</html>
